<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Products</title>
<style>
body{font-family:Arial;max-width:800px;margin:30px auto}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left}th{background:#2563eb;color:#fff}
form{display:flex;gap:8px;margin:20px 0}input{padding:8px;flex:1}button{padding:8px 16px;background:#16a34a;color:#fff;border:none;cursor:pointer}
</style></head><body>
<h1>Product Catalogue</h1>
<form id="form">
  <input id="name" placeholder="Name" required>
  <input id="price" type="number" step="0.01" placeholder="Price" required>
  <input id="rating" type="number" step="0.1" min="0" max="5" placeholder="Rating (0-5)" required>
  <button>Add Product</button>
</form>
<table><thead><tr><th>ID</th><th>Name</th><th>Price (₹)</th><th>Rating</th></tr></thead><tbody id="body"></tbody></table>
<script>
// Client-side rendering: the page fetches JSON from the API and builds rows in the browser
async function load() {
  const products = await (await fetch('/api/products')).json();
  const body = document.getElementById('body');
  body.innerHTML = '';
  products.forEach(p => {
    const tr = document.createElement('tr');
    [p.id, p.name, p.price, '⭐ ' + p.rating].forEach(v => {
      const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const payload = {
    name: document.getElementById('name').value,
    price: document.getElementById('price').value,
    rating: document.getElementById('rating').value
  };
  const res = await fetch('/api/products', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!res.ok) return alert('Could not add product');
  e.target.reset(); load();
});
load();
</script></body></html>
